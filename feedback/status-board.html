<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>STATUS BOARD | POIPOI-STUDIO</title>
  <link rel="stylesheet" href="status-board.css?v=20260605-my-reception">
</head>
<body>
  <div class="board-shell">
    <header class="board-topbar">
      <a class="board-logo" href="index.html" aria-label="AllNew App Factory Feedbackへ戻る">
        <img src="assets/allnew-logo.png" alt="AllNew">
      </a>
      <details class="board-menu">
        <summary aria-label="ページメニューを開く">
          <span>公開ボード</span>
        </summary>
        <nav class="board-menu-list" aria-label="ページメニュー">
          <a href="index.html">トップページ</a>
          <a href="index.html#send">要望を送る</a>
          <a class="is-current" href="status-board.html" aria-current="page">公開ボード</a>
          <a href="https://www.allnew.work/?lang=ja#company" target="_blank" rel="noopener noreferrer">会社情報</a>
        </nav>
      </details>
    </header>

    <main>
      <section class="board-hero" aria-labelledby="boardHeroTitle">
        <div class="board-hero-copy">
          <p class="board-hero-kicker">POIPOI STATUS BOARD</p>
          <h1 id="boardHeroTitle">みんなの声と<br>開発のいま</h1>
          <p>
            いただいた「気づき」や「あったらいいなぁ」が、
            いまどこまで進んでいるかを確認できます。
            開発チームとAIで協力しながら、アプリをもっと良くしていきます。
          </p>
        </div>
        <div class="board-hero-art" aria-label="公開ボードで受付状況と開発の進み具合を確認するイメージ">
          <img class="board-hero-image" src="assets/status-board-hero-v2.png" alt="AIロボットと開発メンバーが進捗ボードを確認するイラスト">
        </div>
      </section>

      <section class="board-panel" aria-labelledby="statusOverviewTitle">
        <div class="board-section-head">
          <div>
            <p class="board-kicker">STATUS BOARD</p>
            <h2 id="statusOverviewTitle">受付状況</h2>
          </div>
          <p id="resultCount" aria-live="polite">0件を表示しています。</p>
        </div>

        <div class="board-view-tabs" role="tablist" aria-label="受付状況の表示切替">
          <button class="board-view-tab is-active" type="button" role="tab" data-board-view="mine" aria-selected="true">自分の受付</button>
          <button class="board-view-tab" type="button" role="tab" data-board-view="public" aria-selected="false">みんなの受付</button>
        </div>

        <section class="my-board-panel" id="myBoardPanel" aria-labelledby="myBoardTitle">
          <div class="my-board-head">
            <div>
              <p class="board-kicker">MY RECEPTION</p>
              <h3 id="myBoardTitle">自分の受付</h3>
            </div>
            <p id="myBoardNickname" class="my-board-nickname"></p>
          </div>
          <p class="my-board-lead">Appleでサインインした端末では、送信した受付番号と進み具合をここで確認できます。</p>
        </section>

        <div class="status-metrics" aria-label="ステータスで絞り込み">
          <button class="status-metric is-active" type="button" data-status-filter="all" aria-pressed="true">
            <i class="metric-mark" aria-hidden="true"></i>
            <span>すべて</span>
            <strong data-metric-count>0</strong>
          </button>
          <button class="status-metric" type="button" data-status-filter="受け付けました" aria-pressed="false">
            <i class="metric-mark" aria-hidden="true"></i>
            <span>受け付けました</span>
            <strong data-metric-count>0</strong>
          </button>
          <button class="status-metric" type="button" data-status-filter="検討しています" aria-pressed="false">
            <i class="metric-mark" aria-hidden="true"></i>
            <span>検討しています</span>
            <strong data-metric-count>0</strong>
          </button>
          <button class="status-metric" type="button" data-status-filter="対応しています" aria-pressed="false">
            <i class="metric-mark" aria-hidden="true"></i>
            <span>対応しています</span>
            <strong data-metric-count>0</strong>
          </button>
          <button class="status-metric" type="button" data-status-filter="出来ました" aria-pressed="false">
            <i class="metric-mark" aria-hidden="true"></i>
            <span>出来ました</span>
            <strong data-metric-count>0</strong>
          </button>
          <button class="status-metric" type="button" data-status-filter="見送り・保留" aria-pressed="false">
            <i class="metric-mark" aria-hidden="true"></i>
            <span>見送り・保留</span>
            <strong data-metric-count>0</strong>
          </button>
        </div>

        <div class="board-controls" aria-label="公開ボードの検索と並び替え">
          <input id="boardSearchInput" type="search" autocomplete="off" placeholder="キーワード・受付番号で探す">
          <select id="boardSortSelect" aria-label="並び替え">
            <option value="updated-desc">更新日が新しい順</option>
            <option value="updated-asc">更新日が古い順</option>
            <option value="accepted-desc">受付日が新しい順</option>
            <option value="accepted-asc">受付日が古い順</option>
            <option value="good-desc">Goodが多い順</option>
          </select>
        </div>

        <div class="board-chip-row" aria-label="カテゴリで絞り込み">
          <button class="board-chip is-active" type="button" data-category-filter="all" aria-pressed="true">すべて</button>
          <button class="board-chip" type="button" data-category-filter="使いやすさ" aria-pressed="false">使いやすさ</button>
          <button class="board-chip" type="button" data-category-filter="新しい機能" aria-pressed="false">新しい機能</button>
          <button class="board-chip" type="button" data-category-filter="見た目・表示" aria-pressed="false">見た目・表示</button>
          <button class="board-chip" type="button" data-category-filter="記録・同期" aria-pressed="false">記録・同期</button>
          <button class="board-chip" type="button" data-category-filter="その他" aria-pressed="false">その他</button>
        </div>

        <div class="board-controls" aria-label="アプリで絞り込み">
          <select id="appFilterSelect" aria-label="アプリで絞り込み">
            <option value="all">すべてのアプリ</option>
          </select>
          <a class="ghost-button board-register-link" href="index.html#send">登録して要望を送る</a>
        </div>

        <div class="board-grid" id="statusList" aria-label="最近の受付状況"></div>
        <div class="board-empty" id="statusEmpty" hidden>
          <p>公開中の受付はまだありません。</p>
          <a class="ghost-button board-register-link" href="index.html#send">登録して最初の要望を送る</a>
        </div>
      </section>

    </main>
  </div>

  <dialog class="detail-drawer" id="detailDialog" aria-label="受付状況の詳細">
    <div class="detail-body" id="detailContent"></div>
  </dialog>

  <script src="i18n.js?v=20260606-bilingual-loopfix"></script>
  <script src="status-board.js?v=20260605-my-reception"></script>
</body>
</html>
