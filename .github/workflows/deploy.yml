name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Fail-closed landing parity gate
        id: landing-sync
        run: |
          set -euo pipefail
          python3 landing-automation/scripts/landing_sync.py --no-record
          git diff --exit-code -- \
            data/landing-apps.generated.json \
            landing-automation/state \
            landing-automation/config/app_catalog.json \
            assets/asc-screenshots \
            assets/app-icons \
            assets/onboarding \
            index.html
          test -z "$(git status --porcelain -- \
            data/landing-apps.generated.json \
            landing-automation/state \
            landing-automation/config/app_catalog.json \
            assets/asc-screenshots \
            assets/app-icons \
            assets/onboarding \
            index.html)"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      # Install the CLI in a step WITHOUT the Vercel secrets in env, so npm
      # package lifecycle scripts (preinstall/install/postinstall) of vercel or
      # any transitive dependency cannot read the production deploy token.
      - name: Install Vercel CLI
        run: |
          node --version
          npm --version
          npm install --global vercel@50.40.0

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Production readback
        id: live-verify
        run: |
          python3 landing-automation/scripts/landing_live_verify.py
