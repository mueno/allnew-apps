name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      # Integrity-lock transitive dependencies and do not execute npm lifecycle
      # scripts. The installed CLI remains trusted code when deployment uses it.
      - name: Install Vercel CLI
        run: npm ci --prefix .github/tools/vercel-cli --ignore-scripts --no-audit --no-fund

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          ./.github/tools/vercel-cli/node_modules/.bin/vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          ./.github/tools/vercel-cli/node_modules/.bin/vercel deploy --prod --yes --token "$VERCEL_TOKEN"
