name: Landing Auto Update

on:
  workflow_dispatch:
    inputs:
      reconcile:
        description: "Reconcile released app metadata from App Store Lookup"
        required: false
        default: "false"
      bootstrap:
        description: "Rebuild from catalog bootstrap set"
        required: false
        default: "false"

permissions:
  contents: write
  deployments: write
  issues: write

concurrency:
  group: landing-auto-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-landing:
    runs-on: [self-hosted, macOS]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Write event payload
        run: |
          cat <<'JSON' > /tmp/landing-event.json
          ${{ toJson(github.event) }}
          JSON

      - name: Event mode (repository_dispatch)
        if: ${{ github.event_name == 'repository_dispatch' }}
        run: |
          python3 landing-automation/scripts/update_landing_data.py --event-file /tmp/landing-event.json

      - name: Bootstrap mode (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap == 'true' && inputs.reconcile != 'true' }}
        run: |
          python3 landing-automation/scripts/update_landing_data.py --bootstrap

      - name: Landing sync (discovery + reconcile + render + parity gate)
        id: landing-sync
        run: |
          python3 landing-automation/scripts/landing_sync.py

      - name: Commit changes
        id: commit-changes
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          RECONCILE_INPUT: ${{ inputs.reconcile }}
          BOOTSTRAP_INPUT: ${{ inputs.bootstrap }}
        run: |
          set -euo pipefail

          COMMIT_PATHS=(
            data/landing-apps.generated.json
            landing-automation/state
            landing-automation/config/app_catalog.json
            assets/asc-screenshots
            assets/app-icons
            assets/onboarding
            index.html
          )

          stage_changes() {
            for path in "${COMMIT_PATHS[@]}"; do
              if [ -e "$path" ]; then
                git add -- "$path"
              fi
            done
          }

          rebuild() {
            if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${BOOTSTRAP_INPUT}" = "true" ] && [ "${RECONCILE_INPUT}" != "true" ]; then
              python3 landing-automation/scripts/update_landing_data.py --bootstrap
            fi
            if [ "${EVENT_NAME}" = "repository_dispatch" ]; then
              python3 landing-automation/scripts/update_landing_data.py --event-file /tmp/landing-event.json
            fi
            python3 landing-automation/scripts/landing_sync.py
          }

          stage_changes
          if git diff --cached --quiet; then
            echo "No changes"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: auto update landing apps data"

          # Retry push because repository_dispatch events can arrive in bursts.
          # On failure, rebuild from latest branch head with the same event payload.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              echo "Push succeeded on attempt ${attempt}"
              echo "changed=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "Push failed after ${attempt} attempts"
              exit 1
            fi

            echo "Push failed on attempt ${attempt}; rebuilding commit from latest ${TARGET_BRANCH}"
            git fetch origin "${TARGET_BRANCH}"
            git reset --hard "origin/${TARGET_BRANCH}"

            rebuild
            stage_changes
            if git diff --cached --quiet; then
              echo "No staged changes after refresh"
              echo "changed=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            git commit -m "chore: auto update landing apps data"
            sleep $((attempt * 2))
          done

      - name: Deploy to Vercel (production)
        if: ${{ steps.commit-changes.outputs.changed == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_WeBWRfPVXtxNAoQpzCzTtyGD
          VERCEL_PROJECT_ID: prj_C3k53GGOeuB0tyjgHnM5mAxx86rH
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. apps.allnew.work is served by Vercel; add the secret in repo settings."
            exit 1
          fi
          npx --yes vercel@50 deploy --prod --yes --token "${VERCEL_TOKEN}"

      - name: Live verification (production readback, one self-heal redeploy)
        id: live-verify
        if: ${{ steps.landing-sync.outcome == 'success' && steps.commit-changes.outcome == 'success' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_WeBWRfPVXtxNAoQpzCzTtyGD
          VERCEL_PROJECT_ID: prj_C3k53GGOeuB0tyjgHnM5mAxx86rH
        run: |
          set -uo pipefail
          verify() {
            python3 landing-automation/scripts/landing_live_verify.py "$@"
          }
          if verify; then
            exit 0
          fi
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::live drift detected and VERCEL_TOKEN is unavailable for self-heal"
            exit 1
          fi
          echo "Live drift detected; redeploying production from committed main HEAD"
          npx --yes vercel@50 deploy --prod --yes --token "${VERCEL_TOKEN}"
          verify --retries 8

      - name: Record live-readback governance escalation
        if: ${{ failure() && steps.live-verify.outcome == 'failure' }}
        run: |
          set +e
          python3 landing-automation/scripts/landing_governance_gate.py \
            --stage block --failed-gate live_readback
          rc=$?
          set -e
          test "$rc" -eq 1

      - name: ANDON — open issue on gate block or live drift
        if: ${{ failure() && (steps.landing-sync.outcome == 'failure' || steps.live-verify.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_OUTCOME: ${{ steps.landing-sync.outcome }}
          LIVE_OUTCOME: ${{ steps.live-verify.outcome }}
        run: |
          set -euo pipefail
          gh label create landing-parity-andon --force \
            --description "Landing/App Store parity or live drift blocked" --color B60205 || true
          stage="parity gate (repo)"
          if [ "${LIVE_OUTCOME}" = "failure" ]; then
            stage="live verification (production readback)"
          fi
          report="{}"
          if [ -f landing-automation/state/governance-report.json ]; then
            report=$(cat landing-automation/state/governance-report.json)
          fi
          body=$(printf 'The landing pipeline blocked at: %s\n\nRun: %s\n\nGovernance report:\n```json\n%s\n```\n\nResolve by fixing the gap, adding an owned expiring exclusion in landing-automation/config/parity_exclusions.json, or using the bounded repair circuit breaker where permitted. Production live-readback failure is never downgraded.' \
            "$stage" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" "$report")
          existing=$(gh issue list --label landing-parity-andon --state open \
            --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "ANDON: landing pipeline blocked" \
              --label landing-parity-andon --body "$body"
          fi
