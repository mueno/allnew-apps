name: One-off Cloudflare DNS cutover

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Point apps.allnew.work to Vercel
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node <<'NODE'
          const accountId = process.env.CF_ACCOUNT_ID;
          const token = process.env.CF_API_TOKEN;
          const zoneName = "allnew.work";
          const recordName = "apps.allnew.work";
          const vercelIp = "76.76.21.21";

          if (!accountId || !token) {
            throw new Error("Cloudflare account id or API token is missing.");
          }

          async function cf(path, init = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...init,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(init.headers || {}),
              },
            });
            const payload = await response.json();
            if (!payload.success) {
              const errors = JSON.stringify(payload.errors || []);
              throw new Error(`${init.method || "GET"} ${path} failed: ${response.status} ${errors}`);
            }
            return payload.result;
          }

          const zones = await cf(`/zones?name=${zoneName}`);
          if (!zones.length) {
            throw new Error(`Cloudflare zone not found: ${zoneName}`);
          }

          const zoneId = zones[0].id;
          const records = await cf(`/zones/${zoneId}/dns_records?name=${recordName}`);
          const desiredRecord = {
            type: "A",
            name: recordName,
            content: vercelIp,
            ttl: 1,
            proxied: false,
          };

          let primary;
          if (records.length) {
            primary = await cf(`/zones/${zoneId}/dns_records/${records[0].id}`, {
              method: "PATCH",
              body: JSON.stringify(desiredRecord),
            });
          } else {
            primary = await cf(`/zones/${zoneId}/dns_records`, {
              method: "POST",
              body: JSON.stringify(desiredRecord),
            });
          }

          for (const extra of records.slice(1)) {
            await cf(`/zones/${zoneId}/dns_records/${extra.id}`, { method: "DELETE" });
          }

          try {
            await cf(`/accounts/${accountId}/pages/projects/allnew-apps/domains/${recordName}`, {
              method: "DELETE",
            });
            console.log("cloudflare_pages_domain: removed");
          } catch (error) {
            console.log(`cloudflare_pages_domain: remove skipped (${error.message})`);
          }

          console.log(JSON.stringify({
            ok: true,
            dns: {
              type: primary.type,
              name: primary.name,
              content: primary.content,
              proxied: primary.proxied,
            },
          }));
          NODE
